<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="/ceova logo light.png" />
    <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="/ceova logo dark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Force No-Cache for index.html to guarantee latest UI/UX changes -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="app-version" content="2.1.0" />

    <title>CEOVA AI | Advanced Assistant</title>
    <!-- Immediate Service Worker & CacheStorage Purge to Force New UI Updates -->
    <script>
      (function() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              if (registrations && registrations.length > 0) {
                for (var reg of registrations) { reg.unregister(); }
                if ('caches' in window) {
                  caches.keys().then(function(names) {
                    Promise.all(names.map(function(n) { return caches.delete(n); })).then(function() {
                      if (!sessionStorage.getItem('ceova_sw_purged')) {
                        sessionStorage.setItem('ceova_sw_purged', '1');
                        window.location.reload();
                      }
                    });
                  });
                } else {
                  if (!sessionStorage.getItem('ceova_sw_purged')) {
                    sessionStorage.setItem('ceova_sw_purged', '1');
                    window.location.reload();
                  }
                }
              }
            }).catch(function() {});
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var name of names) { caches.delete(name); }
            }).catch(function() {});
          }
        } catch (e) {}
      })();
    </script>
    <!-- Pre Connect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="google-site-verification" content="uqZ2r4LMHaTQOtUPdyAuf3soyhSv6GLegU3M9LV7V8M" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <!-- Anti-Clickjacking Defense & Hacker Roast -->
    <style id="anti-clickjack-style">
      html { display: none !important; }
    </style>
    <script>
      (function() {
        try {
          if (window.top === window.self) {
            var styleEl = document.getElementById('anti-clickjack-style');
            if (styleEl && styleEl.parentNode) styleEl.parentNode.removeChild(styleEl);
          } else if (window.top.location.origin === window.self.location.origin) {
            var styleEl = document.getElementById('anti-clickjack-style');
            if (styleEl && styleEl.parentNode) styleEl.parentNode.removeChild(styleEl);
          } else {
            throw new Error('Framed by foreign origin');
          }
        } catch (e) {
          try { window.stop(); } catch(err) {}
          document.documentElement.style.display = 'block';
          document.documentElement.innerHTML = [
            '<div style="background:#09090b;color:#f87171;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;">',
              '<div style="font-size:3.5rem;margin-bottom:16px;">🚨</div>',
              '<h1 style="color:#ffffff;font-size:1.8rem;font-weight:700;margin-bottom:12px;letter-spacing:-0.02em;">NICE TRY, CLICKJACKER!</h1>',
              '<p style="color:#a1a1aa;font-size:1rem;line-height:1.6;max-width:480px;margin-bottom:24px;">',
                'Did you really think you could secretly frame CEOVA inside an invisible iframe to steal user clicks? Go touch some grass! Your malicious frame has been neutralized. 😎',
              '</p>',
              '<div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);border-radius:12px;padding:12px 20px;color:#fca5a5;font-size:0.85rem;font-family:monospace;">',
                'HTTP 403: CLICKJACKING_FRAME_DEFLECTED',
              '</div>',
            '</div>'
          ].join('');
          try {
            window.top.location = window.self.location.href;
          } catch (navErr) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
